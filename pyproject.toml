[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-search"
version = "0.2.0"
description = "Single-chain hierarchical retrieval: doc_id -> section_id -> body_text"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
hierarchical-search = "hierarchical_search.cli:main"

[tool.setuptools.packages.find]
include = ["hierarchical_search*"]
