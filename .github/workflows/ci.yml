name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

  milvus-smoke:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev,milvus]"
      - run: docker compose -f docker-compose.milvus.yaml up -d
      - name: Wait for Milvus
        run: |
          python - <<'PY'
          import time
          from pymilvus import connections

          deadline = time.time() + 180
          last_error = None
          while time.time() < deadline:
              try:
                  connections.connect(uri="http://127.0.0.1:19530")
                  print("milvus_ready")
                  raise SystemExit(0)
              except Exception as e:
                  last_error = e
                  time.sleep(2)
          raise SystemExit(f"milvus_not_ready: {last_error}")
          PY
      - name: Run Milvus smoke tests
        env:
          HS_RUN_MILVUS_TESTS: "1"
          HS_MILVUS_URI: "http://127.0.0.1:19530"
        run: pytest -q tests/test_milvus_smoke.py
      - if: always()
        run: docker compose -f docker-compose.milvus.yaml down -v
