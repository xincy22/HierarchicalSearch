site_name: HierarchicalSearch
site_description: Single-chain hierarchical retrieval (doc_id -> section_id -> body_text)

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.sections
    - toc.follow
    - search.highlight
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Milvus: milvus.md
  - Benchmark: benchmark.md
  - Troubleshooting: troubleshooting.md
